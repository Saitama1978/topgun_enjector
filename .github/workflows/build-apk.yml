name: Build Topgun Injector APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Locate, Re-generate Android Platform & Build APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # I-generate ang android folder kung wala pa
          flutter create . --platforms=android --org=com.topgun.injector
          
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/Topgun-Injector-RenanteFullo.apk

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Topgun-Injector-RenanteFullo
          path: output_apk/Topgun-Injector-RenanteFullo.apk
